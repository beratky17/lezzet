<!DOCTYPE html>
<html lang="tr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#855300">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lezzet Defteri">
  <meta name="description" content="Lezzet Defteri - Kendi lezzet dünyanızı oluşturun, tariflerinizi kaydedin ve mutfak deneyiminizi zenginleştirin.">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <title>Lezzet Defteri | Dijital Tarif Defterim</title>

  <!-- Google Fonts: Lexend & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container" id="main-app-root">

    <!-- ====================================================================
         VIEW 1: ONBOARDING / WELCOME SCREEN
         ==================================================================== -->
    <div id="view-welcome" style="display: none;">
      <div class="welcome-bg"></div>
      <div class="welcome-overlay"></div>
      <div class="welcome-content">
        
        <!-- Top Logo Area -->
        <div class="welcome-header animate-slide-up">
          <div class="welcome-logo-badge">
            <span class="material-symbols-outlined fill">menu_book</span>
          </div>
          <h1 class="welcome-brand-name">Lezzet Defteri</h1>
        </div>

        <!-- Middle & Bottom Action Area -->
        <div class="welcome-bottom animate-slide-up">
          <h2 class="welcome-title">Kendi Lezzet Dünyanı Oluştur</h2>
          <p class="welcome-subtitle">
            Tariflerinizi kaydedin, yeni ilhamlar bulun ve mutfak maceranızı kişiselleştirin.
          </p>
          <button class="btn-welcome-start press-effect" onclick="App.startAppFromWelcome()">
            <span>Hemen Başla</span>
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </div>

      </div>
    </div>

    <!-- ====================================================================
         TOP APP BAR (General)
         ==================================================================== -->
    <header class="top-app-bar" id="app-top-bar">
      <div class="brand-title">
        <span class="material-symbols-outlined fill" style="color: var(--color-primary);">menu_book</span>
        <span>Lezzet Defteri</span>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <button class="icon-btn press-effect" onclick="App.showView('profile')" title="Profil & Ayarlar">
          <span class="material-symbols-outlined">account_circle</span>
        </button>
      </div>
    </header>

    <!-- ====================================================================
         VIEW 2: HOME / RECIPES FEED (Tariflerim)
         ==================================================================== -->
    <main id="view-home" class="view-main-content">
      
      <!-- Search Input -->
      <section class="search-container">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="main-search-input" class="search-input" placeholder="Tarif veya malzeme ara..." autocomplete="off">
        <button id="main-search-clear" class="search-clear-btn" title="Temizle">
          <span class="material-symbols-outlined" style="font-size: 20px;">close</span>
        </button>
      </section>

      <!-- Category Filter Chips Horizontal Scroll (Enriched Categories) -->
      <section class="categories-container" id="categories-scroll">
        <button class="category-chip active press-effect" data-category="all">Hepsi</button>
        <button class="category-chip press-effect" data-category="favoriler">❤️ Favorilerim</button>
        <button class="category-chip press-effect" data-category="ana-yemek">Ana Yemekler</button>
        <button class="category-chip press-effect" data-category="icecek">🍹 İçecekler</button>
        <button class="category-chip press-effect" data-category="tatli">Tatlılar</button>
        <button class="category-chip press-effect" data-category="hamur-isi">🥟 Hamur İşleri</button>
        <button class="category-chip press-effect" data-category="salata-meze">🥗 Salata & Meze</button>
        <button class="category-chip press-effect" data-category="kahvaltilik">🍳 Kahvaltılık</button>
        <button class="category-chip press-effect" data-category="corba">🍲 Çorbalar</button>
        <button class="category-chip press-effect" data-category="zeytinyagli">🫒 Zeytinyağlılar</button>
        <button class="category-chip press-effect" data-category="atistirmalik">🍿 Atıştırmalıklar</button>
        <button class="category-chip press-effect" data-category="sos">🍯 Soslar & Reçeller</button>
      </section>

      <!-- Recipes Grid -->
      <section class="recipes-grid" id="recipes-grid">
        <!-- Rendered dynamically via App.renderHome() -->
      </section>

    </main>

    <!-- ====================================================================
         VIEW 3: RECIPE DETAIL (Tarif Detayı)
         ==================================================================== -->
    <div id="view-detail" style="display: none;">
      <!-- Rendered dynamically via App.renderDetail() -->
    </div>

    <!-- ====================================================================
         VIEW 4: ADD / EDIT RECIPE (Tarif Ekle & Düzenle)
         ==================================================================== -->
    <div id="view-add" style="display: none;">
      <!-- Rendered dynamically via App.renderForm() -->
    </div>

    <!-- ====================================================================
         VIEW 5: PROFILE & STATS (Profilim & Ayarlar)
         ==================================================================== -->
    <div id="view-profile" style="display: none;">
      <!-- Rendered dynamically via App.renderProfile() -->
    </div>

    <!-- ====================================================================
         BOTTOM NAVIGATION BAR (Mobile First)
         ==================================================================== -->
    <nav class="bottom-nav" id="app-bottom-nav">
      <!-- Nav Home -->
      <button class="nav-item active press-effect" data-nav="home" onclick="App.showView('home')">
        <span class="material-symbols-outlined">home</span>
        <span style="font-size: 0.72rem; font-weight: 600; margin-top: 2px;">Tarifler</span>
      </button>

      <!-- Nav Add Recipe (Center Floating Action Button) -->
      <button class="nav-fab press-effect" onclick="App.showView('add')" title="Yeni Tarif Ekle">
        <span class="material-symbols-outlined" style="font-size: 32px; font-weight: 700;">add</span>
      </button>

      <!-- Nav Profile -->
      <button class="nav-item press-effect" data-nav="profile" onclick="App.showView('profile')">
        <span class="material-symbols-outlined">person</span>
        <span style="font-size: 0.72rem; font-weight: 600; margin-top: 2px;">Profilim</span>
      </button>
    </nav>

    <!-- ====================================================================
         COOKING TIMER MODAL
         ==================================================================== -->
    <div class="modal-backdrop" id="timer-modal" style="display: none;">
      <div class="modal-content animate-scale-in">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="material-symbols-outlined" style="color: var(--color-primary);">timer</span>
            <h3 id="timer-modal-title" style="font-size: 1.1rem; font-weight: 700; color: var(--color-on-surface);">Pişirme Sayacı</h3>
          </div>
          <button class="icon-btn press-effect" onclick="App.closeTimerModal()">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <div class="timer-display" id="timer-countdown-display">00:00</div>

        <div style="display: flex; gap: 10px;">
          <button id="timer-start-pause-btn" class="btn-primary press-effect" style="flex: 1;" onclick="App.toggleTimerPause()">
            <span class="material-symbols-outlined">pause</span> Duraklat
          </button>
          <button class="btn-secondary press-effect" onclick="App.resetTimer()">
            <span class="material-symbols-outlined">restart_alt</span> Sıfırla
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- App Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Service Worker kaydı (PWA - çevrimdışı destek)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('Service worker kaydı başarısız:', err);
        });
      });
    }
  </script>
</body>
</html>
